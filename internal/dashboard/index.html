<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>rollout · Infrastructure</title>
<style>
:root {
  --bg:#f0f3f7;
  --panel:#fff;
  --card:#fff;
  --card-hover:#f6f8fb;
  --fg:#203249;
  --muted:#5b6d83;
  --faint:#738399;
  --line:#d7e0ea;
  --line-strong:#b2c2d5;
  --accent:#315fbd;
  --accent-soft:#eaf0fc;
  --ok:#207651;
  --warn:#946211;
  --bad:#bd394b;
  --info:#315fbd;
  --none:#6b7584;
  --header:#1d2e47;
  --header-fg:#f0f4fc;
  --mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace;
}
@media(prefers-color-scheme:dark) {
  :root {
    --bg:#172231;
    --panel:#203044;
    --card:#25364a;
    --card-hover:#2b3e55;
    --fg:#e4ecf6;
    --muted:#a8b8cc;
    --faint:#92a4ba;
    --line:#3c4e64;
    --line-strong:#6b83a1;
    --accent:#9bbcff;
    --accent-soft:#2c4265;
    --ok:#7ed6ad;
    --warn:#e6bf78;
    --bad:#ff9aa9;
    --info:#9bbcff;
    --none:#acb8c9;
  }
}
* {
  box-sizing:border-box
}
html {
  height:100%;
  scroll-padding-top:110px
}
body {
  margin:0;
  background:var(--bg);
  color:var(--fg);
  font:14px/1.5 "Avenir Next","Segoe UI",sans-serif
}
button,select,input {
  font:inherit
}
button,select {
  color:inherit
}
button,a,select,input {
  touch-action:manipulation
}
button {
  cursor:pointer
}
button:disabled {
  cursor:wait;
  opacity:.55
}
:focus-visible {
  outline:3px solid var(--accent);
  outline-offset:4px
}
button:focus-visible,a:focus-visible,select:focus-visible {
  border-radius:5px
}
a {
  color:var(--accent);
  text-decoration:none
}
a:hover {
  text-decoration:underline
}
code,pre,.mono {
  font-family:var(--mono);
  font-size:12px
}
pre {
  white-space:pre;
  tab-size:2
}
h1,h2,h3,h4,p {
  margin:0
}
h1 {
  font-size:32px;
  line-height:1.2;
  font-weight:650;
  letter-spacing:-1px
}
h2 {
  font-size:20px;
  line-height:1.3;
  font-weight:650;
  letter-spacing:-.4px
}
h3 {
  font-size:16px;
  font-weight:650
}
h4 {
  font-size:14px;
  font-weight:600
}
svg.i {
  width:17px;
  height:17px;
  flex:none;
  stroke:currentColor;
  fill:none;
  stroke-width:1.7;
  stroke-linecap:round;
  stroke-linejoin:round
}
[hidden] {
  display:none!important
}
.skip {
  position:fixed;
  top:-80px;
  left:20px;
  z-index:60;
  background:var(--panel);
  padding:12px
}
.skip:focus {
  top:12px
}
header {
  position:sticky;
  top:0;
  z-index:20;
  min-height:68px;
  display:flex;
  align-items:center;
  gap:22px;
  padding:12px 28px;
  background:var(--header);
  color:var(--header-fg);
  box-shadow:0 1px 0 #fff1
}
.brand {
  display:flex;
  align-items:center;
  gap:9px;
  flex:none;
  border:0;
  background:none;
  color:inherit;
  font-size:18px;
  font-weight:650;
  letter-spacing:-.6px;
  padding:4px 0
}
.brand svg {
  width:25px;
  height:25px
}
.breadcrumbs {
  display:flex;
  align-items:center;
  gap:14px;
  min-width:0
}
.crumb {
  display:flex;
  align-items:center;
  gap:8px;
  min-width:0
}
.crumb select {
  appearance:auto;
  border:0;
  background:transparent;
  color:inherit;
  padding:7px 20px 7px 0;
  max-width:240px;
  font-weight:550;
  text-overflow:ellipsis;
  cursor:pointer
}
.crumb select option {
  background:var(--panel);
  color:var(--fg)
}
.crumb select:disabled {
  opacity:.65;
  cursor:default
}
.crumb-separator {
  color:#9fb2cd;
  font-size:21px;
  font-weight:300
}
.crumb svg {
  color:#a9bddb
}
.spacer {
  flex:1
}
.header-tools {
  display:flex;
  align-items:center;
  gap:18px
}
.toggle {
  display:flex;
  align-items:center;
  gap:7px;
  font-size:12px;
  white-space:nowrap
}
.toggle input {
  accent-color:#a8c6ff
}
.checked {
  color:#b8c8de;
  font-size:12px;
  white-space:nowrap
}
.btn {
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  border:1px solid var(--line);
  background:var(--panel);
  border-radius:7px;
  padding:7px 12px;
  font-weight:550;
  font-size:12px
}
.btn:hover {
  background:var(--card-hover);
  border-color:var(--line-strong)
}
header .btn {
  background:#ffffff0c;
  border-color:#ffffff35;
  color:inherit
}
header .btn:hover {
  background:#ffffff1a
}
.btn.primary {
  background:var(--accent);
  color:var(--panel);
  border-color:var(--accent)
}
.btn.spin svg {
  animation:spin 1s linear infinite
}
@keyframes spin {
  to {
    transform:rotate(360deg)
  }
}
main {
  max-width:1740px;
  min-height:calc(100vh - 68px);
  margin:auto;
  padding:36px 40px 72px
}
.page-head {
  display:flex;
  align-items:flex-start;
  gap:24px;
  justify-content:space-between;
  margin-bottom:28px
}
.page-title {
  display:flex;
  align-items:center;
  gap:12px
}
.page-title>.i {
  width:28px;
  height:28px;
  color:var(--muted)
}
.page-description {
  color:var(--muted);
  margin-top:8px;
  max-width:78ch
}
.page-actions {
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
  justify-content:flex-end
}
.env {
  margin-top:7px;
  color:var(--faint);
  font-size:12px;
  overflow-wrap:anywhere
}
.summary {
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap
}
.metric {
  padding:0 18px;
  border-left:1px solid var(--line);
  color:var(--muted);
  font-size:12px
}
.metric b {
  font-size:18px;
  display:block;
  color:var(--fg);
  font-weight:600
}
.metrics {
  display:flex;
  align-items:center
}
.badge {
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:3px 8px;
  border-radius:5px;
  font-size:11px;
  font-weight:550;
  white-space:nowrap;
  color:var(--c);
  background:color-mix(in srgb,var(--c) 8%,transparent)
}
.badge svg.i {
  width:12px;
  height:12px
}
.c-ok {
  --c:var(--ok)
}
.c-warn {
  --c:var(--warn)
}
.c-bad {
  --c:var(--bad)
}
.c-info {
  --c:var(--info)
}
.c-none {
  --c:var(--none)
}
.c-accent {
  --c:var(--accent)
}
.dot {
  display:inline-block;
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--c);
  flex:none
}
.muted {
  color:var(--muted)
}
.faint {
  color:var(--faint)
}
.warn-text {
  color:var(--warn)
}
.banner {
  border-left:3px solid var(--bad);
  background:color-mix(in srgb,var(--bad) 7%,var(--panel));
  color:var(--bad);
  padding:13px 16px;
  margin-bottom:24px;
  white-space:pre-wrap;
  overflow-wrap:anywhere
}
.banner p {
  color:var(--muted);
  margin-top:4px
}
.empty {
  padding:36px 22px;
  color:var(--muted);
  text-align:center
}
.empty h2 {
  color:var(--fg);
  margin-bottom:8px
}
.empty .btn {
  margin-top:16px
}
.section-heading {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:18px;
  margin-bottom:16px
}
.section-heading p {
  font-size:12px;
  color:var(--muted)
}
.section-heading h2 {
  font-size:17px
}
.server-grid {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));
  gap:20px
}
.server-card {
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:12px;
  overflow:hidden
}
.server-card-top {
  padding:22px;
  border-bottom:1px solid var(--line)
}
.server-card-title {
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:9px
}
.server-icon {
  width:34px;
  height:34px;
  display:grid;
  place-items:center;
  border:1px solid var(--line);
  border-radius:8px;
  color:var(--muted);
  background:var(--card-hover);
  flex:none
}
.server-card-top .btn {
  margin-top:18px
}
.server-stack-list {
  padding:5px 18px
}
.server-stack-item {
  display:flex;
  align-items:center;
  gap:10px;
  padding:14px 4px;
  border-bottom:1px solid var(--line)
}
.server-stack-item:last-child {
  border:0
}
.text-link {
  padding:0;
  border:0;
  background:none;
  color:var(--accent);
  font-weight:600;
  text-align:left
}
.text-link:hover {
  text-decoration:underline
}
.server-card-foot {
  padding:12px 22px;
  color:var(--muted);
  font-size:12px;
  background:var(--card-hover)
}
.stack-grid {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));
  gap:18px
}
.stack-tile {
  display:flex;
  flex-direction:column;
  align-items:stretch;
  text-align:left;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:10px;
  padding:22px;
  gap:16px
}
.stack-tile:hover {
  border-color:var(--accent)
}
.stack-tile-head {
  display:flex;
  gap:10px;
  align-items:center
}
.stack-tile-head h2 {
  font-size:19px;
  flex:1
}
.stack-tile-head>svg {
  color:var(--muted)
}
.stack-tile .summary {
  gap:6px
}
.stack-tile .service-names {
  color:var(--muted);
  font-size:12px;
  min-height:36px;
  overflow-wrap:anywhere
}
.stack-tile-bottom {
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding-top:14px;
  border-top:1px solid var(--line);
  font-size:12px
}
.stack-tile-bottom .release {
  font-family:var(--mono);
  font-size:11px
}
.tile-count {
  color:var(--muted);
  font-size:12px
}
.stack-toolbar {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:8px;
  padding:13px 18px;
  margin-bottom:28px;
  flex-wrap:wrap
}
.release-info {
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
  font-size:12px;
  color:var(--muted)
}
.release-info b {
  color:var(--fg);
  font-family:var(--mono)
}
.release-message {
  max-width:50ch;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap
}
.board-top {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  margin-bottom:16px
}
.board-top h2 {
  font-size:17px
}
.board-top p {
  font-size:12px;
  color:var(--muted)
}
.service-board {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));
  gap:30px 24px;
  align-items:start
}
.service-group {
  min-width:0;
  scroll-margin-top:100px;
  border-top:2px solid var(--line-strong);
  padding:16px 0 0
}
.service-group.focused {
  border-color:var(--accent)
}
.service-heading {
  display:flex;
  align-items:center;
  gap:9px;
  min-height:28px
}
.service-heading .service-title {
  color:var(--fg);
  font-size:17px;
  font-weight:650;
  letter-spacing:-.3px
}
.service-heading .service-symbol {
  color:var(--accent)
}
.service-heading .replica-count {
  margin-left:auto;
  color:var(--muted);
  font-size:11px
}
.service-meta {
  display:flex;
  gap:7px;
  align-items:center;
  margin-top:8px;
  flex-wrap:wrap
}
.service-connections {
  min-height:26px;
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:6px;
  margin:10px 0 13px;
  font-size:11px;
  color:var(--muted)
}
.connection-link {
  display:inline-flex;
  gap:5px;
  align-items:center;
  padding:3px 7px;
  border:1px solid var(--line);
  background:var(--panel);
  color:var(--accent);
  border-radius:5px;
  font-size:11px;
  max-width:100%;
  overflow-wrap:anywhere
}
.connection-link:hover {
  border-color:var(--accent);
  background:var(--accent-soft)
}
.connection-link svg {
  width:12px;
  height:12px
}
.container-list {
  display:grid;
  grid-template-columns:1fr;
  gap:17px
}
.container-wrap {
  min-width:0
}
.container-card {
  width:100%;
  display:block;
  position:relative;
  text-align:left;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:9px;
  padding:16px
}
.container-card:hover {
  border-color:var(--line-strong);
  background:var(--card-hover)
}
.container-card.selected {
  border-color:var(--accent);
  box-shadow:0 0 0 2px var(--accent-soft)
}
.container-card.ghost {
  border-style:dashed;
  background:transparent
}
.container-top {
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:7px
}
.container-top .i {
  color:var(--muted);
  width:14px;
  height:14px
}
.container-name {
  font-size:12px;
  font-weight:600;
  overflow-wrap:anywhere;
  word-break:break-word
}
.container-top .state-text {
  margin-left:auto;
  font-size:11px;
  color:var(--c);
  display:flex;
  gap:5px;
  align-items:center;
  flex:none
}
.container-image {
  font-family:var(--mono);
  font-size:10px;
  color:var(--muted);
  overflow-wrap:anywhere;
  margin-bottom:14px
}
.container-data {
  display:flex;
  gap:12px;
  align-items:center;
  justify-content:space-between;
  font-size:11px;
  color:var(--muted);
  border-top:1px solid var(--line);
  padding-top:10px
}
.container-data>span {
  display:flex;
  align-items:center;
  gap:5px
}
.container-data svg {
  width:12px;
  height:12px
}
.container-resources {
  margin:0 12px;
  border-left:1px solid var(--line-strong);
  padding:10px 0 0 12px;
  display:flex;
  flex-direction:column;
  gap:7px
}
.resource {
  position:relative;
  display:flex;
  align-items:center;
  gap:7px;
  min-width:0;
  border:1px solid var(--line);
  border-radius:5px;
  background:var(--panel);
  padding:6px 8px;
  font-size:10px
}
.resource::before {
  content:"";
  position:absolute;
  width:13px;
  left:-13px;
  top:50%;
  border-top:1px solid var(--line-strong)
}
.resource>svg {
  width:13px;
  height:13px;
  color:var(--muted)
}
.resource-name {
  font-family:var(--mono);
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis
}
.resource-target {
  margin-left:auto;
  color:var(--muted);
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
  max-width:46%;
  font-family:var(--mono)
}
.ro {
  color:var(--warn);
  font-size:9px;
  white-space:nowrap
}
.container-endpoints {
  display:flex;
  gap:5px;
  flex-wrap:wrap;
  margin:8px 0 0 12px
}
.chip {
  display:inline-flex;
  align-items:center;
  gap:4px;
  border:1px solid var(--line);
  background:var(--panel);
  border-radius:5px;
  padding:3px 6px;
  font-size:10px;
  max-width:100%;
  overflow-wrap:anywhere;
  color:var(--muted)
}
.chip svg.i {
  width:11px;
  height:11px
}
.chip .dot {
  width:5px;
  height:5px
}
.container-links {
  margin:8px 0 0 12px;
  display:flex;
  align-items:center;
  gap:5px;
  flex-wrap:wrap
}
.container-links .link-label {
  font-size:10px;
  color:var(--muted);
  width:100%
}
.no-containers {
  padding:18px;
  border:1px dashed var(--line-strong);
  border-radius:9px;
  color:var(--muted);
  font-size:12px
}
.no-containers b {
  display:block;
  margin-bottom:5px;
  color:var(--fg)
}
.connection-section {
  margin-top:36px;
  padding-top:24px;
  border-top:1px solid var(--line)
}
.connection-section .section-heading {
  margin-bottom:12px
}
.connection-section .section-heading p {
  max-width:65ch
}
.connection-list {
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:8px;
  overflow:hidden
}
.connection-row {
  display:grid;
  grid-template-columns:minmax(100px,1fr) 22px minmax(100px,1fr) minmax(130px,1fr);
  gap:15px;
  align-items:center;
  padding:11px 16px;
  border-bottom:1px solid var(--line);
  font-size:12px
}
.connection-row:last-child {
  border:0
}
.connection-row>svg {
  color:var(--muted);
  width:15px;
  height:15px
}
.connection-kind {
  color:var(--muted);
  font-size:11px;
  overflow-wrap:anywhere
}
.connection-row .text-link {
  font-size:12px;
  overflow-wrap:anywhere
}
aside {
  position:fixed;
  top:68px;
  right:0;
  bottom:0;
  width:min(600px,100vw);
  z-index:30;
  background:var(--panel);
  border-left:1px solid var(--line-strong);
  box-shadow:-12px 0 35px #1724381a;
  display:flex;
  flex-direction:column
}
aside:not(.open) {
  display:none
}
.panel-head {
  padding:22px 22px 0
}
.panel-title {
  display:flex;
  align-items:center;
  gap:10px
}
.panel-title h2 {
  font-size:19px
}
.panel-title .srv {
  color:var(--muted);
  font-size:12px
}
.panel-title .close {
  margin-left:auto;
  border:0;
  background:var(--card-hover);
  border-radius:6px;
  padding:7px;
  color:var(--muted)
}
.panel-badges {
  display:flex;
  gap:6px;
  margin-top:14px;
  flex-wrap:wrap
}
.tabs {
  display:flex;
  gap:2px;
  margin-top:18px;
  border-bottom:1px solid var(--line);
  overflow-x:auto
}
.tabs button {
  border:0;
  background:none;
  padding:10px 9px;
  color:var(--muted);
  border-bottom:2px solid transparent;
  font-size:12px
}
.tabs button.on {
  color:var(--accent);
  border-bottom-color:var(--accent)
}
.panel-body {
  padding:22px;
  overflow:auto;
  flex:1
}
.section {
  margin-bottom:24px
}
.section h4 {
  font-size:13px;
  margin-bottom:10px
}
.box {
  border:1px solid var(--line);
  border-radius:8px;
  background:var(--card)
}
.box+.box {
  margin-top:10px
}
.box.focus {
  border-color:var(--accent)
}
.box-head {
  display:flex;
  align-items:center;
  gap:8px;
  padding:12px;
  border-bottom:1px solid var(--line);
  flex-wrap:wrap
}
.box-head b {
  font-size:11px;
  font-family:var(--mono);
  overflow-wrap:anywhere
}
.box-head .right {
  margin-left:auto;
  font-size:11px;
  color:var(--muted)
}
.kv {
  display:grid;
  grid-template-columns:100px minmax(0,1fr);
  gap:8px 14px;
  font-size:12px
}
.kv dt {

function panelFiles(app) {
  if (!app.svc) return h("div", { class: "empty" }, "Not in rollout.json.");
  return [h("div", { class: "muted", style: "margin-bottom:8px" }, `${app.svc.files.length} files shipped from `, h("code", {}, app.svc.path)),
    h("pre", { class: "code" }, app.svc.files.join("\n"))];
}

// ---------- data loading ----------
// Keep the bootstrap credential out of copied URLs and HTTP referrers.
const sessionURL = new URL(location.href);
const sessionToken = sessionURL.searchParams.get("token") || sessionStorage.getItem("rolloutToken") || "";
if (sessionToken) sessionStorage.setItem("rolloutToken", sessionToken);
sessionURL.searchParams.delete("token");
history.replaceState(null, "", sessionURL);
function apiFetch(url) {
  return fetch(url, { headers: { "X-Rollout-Token": sessionToken } });
}

async function loadModel() {
  const r = await apiFetch("/api/model");
  if (!r.ok) throw new Error(await r.text());
  state.model = await r.json();
}

async function refresh() {
  if (state.loading) return;
  state.loading = true;
  const btn = document.getElementById("refresh");
  btn.disabled = true; btn.classList.add("spin");
  document.getElementById("checked").textContent = "checking servers…";
  try {
    await loadModel();
    render();
    const r = await apiFetch("/api/status");
    if (!r.ok) throw new Error(await r.text());
    state.status = (await r.json()) || [];
    state.statusError = "";
    state.checkedAt = new Date();
    // Deployment lists may be stale now; reload the open one.
    state.history = {};
  } catch (e) {
    state.statusError = e.message;
  } finally {
    state.loading = false;
    btn.disabled = false; btn.classList.remove("spin");
    document.getElementById("checked").textContent = state.checkedAt ? "checked " + state.checkedAt.toLocaleTimeString() : "";
    render();
    const app = currentApp();
    if (app && state.panel.tab === "deployments") loadHistory(app);
  }
}

// ---------- wiring ----------
document.querySelector(".skip").addEventListener("click", e => { e.preventDefault(); document.getElementById("main").focus(); });
document.getElementById("refresh").addEventListener("click", refresh);
document.getElementById("home").addEventListener("click", () => navigate());
document.getElementById("server-select").addEventListener("change", e => navigate(e.target.value));
document.getElementById("stack-select").addEventListener("change", e => navigate(state.server, e.target.value));
const auto = document.getElementById("auto");
auto.checked = state.auto;
auto.addEventListener("change", () => { state.auto = auto.checked; localStorage.setItem("rollout.auto", state.auto); });
setInterval(() => { if (state.auto && !document.hidden) refresh(); }, 30000);
addEventListener("keydown", e => { if (e.key === "Escape" && state.panel) closePanel(); });

function restoreRoute() {
  readHash(); render();
  const app = currentApp();
  if (app && state.panel.tab === "deployments") loadHistory(app);
}
addEventListener("hashchange", restoreRoute);
addEventListener("popstate", restoreRoute);
readHash();
render();
refresh();
</script>
</body>
</html>
