name: rollout
description: Deploy Docker Compose services to servers over SSH
branding:
  icon: upload-cloud
  color: purple

inputs:
  args:
    description: Arguments for rollout, e.g. "deploy --all" or "deploy web api"
    required: true
  config:
    description: Path to the environment file
    default: rollout.json
  ssh-key:
    description: Private SSH key used to connect to the servers (not needed with Tailscale SSH)
    required: false
  secrets:
    description: >-
      JSON object of secrets for ${NAME} references in services' .env files.
      Pass toJSON(secrets) in an expression to make every repository secret
      available.
    required: false

runs:
  using: composite
  steps:
    - uses: actions/setup-go@v5
      with:
        go-version-file: ${{ github.action_path }}/go.mod
        cache-dependency-path: ${{ github.action_path }}/go.sum

    # Build from the action's own checkout so the binary matches the ref in `uses:`.
    - name: Build rollout
      shell: bash
      working-directory: ${{ github.action_path }}
      run: go build -o "$RUNNER_TEMP/rollout" ./cmd/rollout

    - name: Run rollout
      shell: bash
      env:
        ROLLOUT_SSH_KEY: ${{ inputs.ssh-key }}
        ROLLOUT_SECRETS: ${{ inputs.secrets }}
        ROLLOUT_CONFIG: ${{ inputs.config }}
        ARGS: ${{ inputs.args }}
      run: |
        python3 - <<'PYTHON'
        import os
        import shlex
        import sys

        try:
            args = shlex.split(os.environ["ARGS"])
        except ValueError as exc:
            sys.exit(f"Invalid rollout arguments: {exc}")
        executable = os.path.join(os.environ["RUNNER_TEMP"], "rollout")
        os.execv(executable, [executable, *args])
        PYTHON
